name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          # The Android Gradle Plugin does not support JDK 25+, which is what
          # newer runners and distributions default to.
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew :shared:jvmTest

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; the release would be unsigned"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > androidApp/release-keystore.jks
          # Written, never echoed.
          {
            echo "storeFile=androidApp/release-keystore.jks"
            echo "storeAlias=$KEY_ALIAS"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Build signed release APK
        run: ./gradlew :androidApp:assembleRelease

      - name: Verify the APK is signed
        run: |
          APK=$(find androidApp/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "::error::no release APK was produced"; exit 1; fi
          # Runners carry several build-tools versions, so pick exactly one
          # rather than letting a glob pass the rest as arguments.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          # --verbose is what prints the "Verified using ... scheme" summary;
          # --print-certs alone lists certificates but not the schemes.
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/verify.txt
          # Assert the scheme rather than trusting the exit code alone.
          grep -qE "APK Signature Scheme v[23]\): true" /tmp/verify.txt \
            || { echo "::error::APK is not signed under scheme v2 or v3"; exit 1; }
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Build desktop packages
        run: ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APK }}
            desktopApp/build/compose/binaries/main/deb/*.deb
            desktopApp/build/compose/binaries/main/rpm/*.rpm
          generate_release_notes: true

      - name: Remove signing material
        if: always()
        run: rm -f androidApp/release-keystore.jks keystore.properties
